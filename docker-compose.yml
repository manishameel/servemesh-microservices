

services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: authpass
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  vendor-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vendor
      POSTGRES_PASSWORD: vendorpass
      POSTGRES_DB: vendor_db
    ports:
      - "5435:5432"
    volumes:
      - vendor-db-data:/var/lib/postgresql/data

  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: bookingpass
      POSTGRES_DB: booking_db
    ports:
      - "5434:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  api-gateway:
    build: ./api-gateway
    ports:
      - "4000:4000"

  auth-service:
    build: ./auth-service
    ports:
      - "4001:4001"
    depends_on:
      - auth-db

  booking-service:
    build: ./booking-service
    ports:
      - "4002:4002"
    depends_on:
      - booking-db
      - kafka

  vendor-service:
    build: ./vendor-service
    ports:
      - "4003:4003"
    depends_on:
      - vendor-db

  notification-service:
    build: ./notification-service
    ports:
      - "4004:4004"

  websocket-server:
    build: ./websocket-server
    ports:
      - "4005:4005"


volumes:
  auth-db-data:
  vendor-db-data:
  booking-db-data: